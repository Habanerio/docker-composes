### Monitoring / Charts & Graphs

  grafana:
    image: grafana/grafana
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    user: root
    ports:
      - 3100:3000
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/plugins:/var/lib/grafana/plugins
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    networks:
      - dev-network
    depends_on:
      - prometheus

# Prometheu: Create a prometheus.yml config file in ~/.docker/prometheus and copy/paste the following (excluding #)
# scrape_configs:
# - job_name: cadvisor
#   scrape_interval: 5s
#   static_configs:
#   - targets:
#     - cadvisor:3110

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    user: root
    ports:
      - "3101:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus
    networks:
     - dev-network
    depends_on:
      - cadvisor

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    container_name: cadvisor
    hostname: cadvisor
    restart: unless-stopped
    ports:
      - 3110:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - dev-network
    depends_on:
      - redis

  structurizr:
    image: structurizr/onpremises
    container_name: structurizr
    hostname: structurizr
    restart: unless-stopped
    ports:
      - 3200:8080
    volumes:
      - ./structurizr:/data
    networks:
      - dev-network

### Artifacts
  # Artifactory comes with a pre-configured default "admin" account. Username: admin, Password: password.
  artifactory:
    image: docker.bintray.io/jfrog/artifactory-oss:latest
    container_name: artifactory
    hostname: artifactory
    user: root
    restart: unless-stopped
    ports:
      - 8081:8081 # This must not be changed as it is expected by the container
      - 8082:8082 # This must not be changed as it is expected by the container
    volumes:
      - ./artifactory:/var/opt/jfrog/artifactory
    networks:
      - dev-network

