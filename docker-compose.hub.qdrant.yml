services:
   qdrant:
      image: qdrant/qdrant:latest
      container_name: qdrant
      hostname: qdrant
      volumes:
         - ${DOCKER_DATA}/qdrant/data:/qdrant/storage
      ports:
         - '6333:6333'
         - '6334:6334'
      environment:
         - QDRANT_ALLOW_CORS=true
      restart: unless-stopped
      logging:
         driver: 'json-file'
         options:
            max-size: '5m'
            max-file: '10'
      networks:
         - jarvis
