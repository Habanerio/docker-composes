services:
   wordpress:
      image: wordpress:latest
      container_name: wordpress
      volumes:
         - ${DOCKER_DATA}/wp/wp-content:/var/www/html/wp-content
      environment:
         - WORDPRESS_DB_NAME=wordpress
         - WORDPRESS_TABLE_PREFIX=wp_
         - WORDPRESS_DB_HOST=wpdb
         - WORDPRESS_DB_USER=root
         - WORDPRESS_DB_PASSWORD=password
      depends_on:
         - wpdb
         - phpmyadmin
      restart: always
      ports:
         - 9999:80
      networks:
         - wordpress

   wpdb:
      image: mariadb:latest
      container_name: wpdb
      volumes:
         - db_data:/var/lib/mysql
         # This is optional!!!
         - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql
         # # #
      environment:
         - MYSQL_ROOT_PASSWORD=password
         - MYSQL_USER=root
         - MYSQL_PASSWORD=password
         - MYSQL_DATABASE=wordpress
      restart: always
      networks:
         - wordpress

   phpmyadmin:
      depends_on:
         - wpdb
      image: phpmyadmin/phpmyadmin:latest
      container_name: phpmyadmin
      restart: always
      ports:
         - 9998:80
      environment:
         PMA_HOST: wpdb
         MYSQL_ROOT_PASSWORD: password
      logging:
         driver: 'json-file'
         options:
            max-size: '5m'
            max-file: '10'
      networks:
         - wordpress

#networks:
#   wordpress:
#      name: wordpress

volumes:
   db_data:
