services:
   n8n:
      image: docker.n8n.io/n8nio/n8n
      container_name: n8n
      hostname: n8n
      restart: unless-stopped
      user: 1000:1000
      environment:
         - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
         - GENERIC_TIMEZONE=${TZ}
         - TZ=${TZ}
      ports:
         - 5678:5678
      volumes:
         - n8n_data:/home/node/.n8n
         - ${DOCKER_DATA}/n8n/files:/files
      logging:
         driver: 'json-file'
         options:
            max-size: '5m'
            max-file: '10'
      networks:
         - jarvis

volumes:
   n8n_data:
